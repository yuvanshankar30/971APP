<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Single fixed icon (black background + yellow helmet) — does not swap
		     with the light/dark theme, unlike the in-app nav brand-mark. This is
		     also what Chrome uses to generate the macOS app icon when the site is
		     installed as an app ("Install Spartans Hub..."). -->
		<link rel="icon" sizes="512x512" href="/favicon.png" type="image/png">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
		<link rel="manifest" href="/manifest.json">
		<meta name="theme-color" content="#0a0a0a" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="build-marker" content="adminfix-2026-06-18" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		<title>Manufacturing Management System</title>
		<script>
			// Apply saved theme before render to avoid a flash of the wrong theme.
			// Modern Light is the default for anyone without a saved preference.
			try {
				var t = localStorage.getItem('app-theme');
				if (t === 'dark') t = 'modern-dark'; // legacy dark removed — migrate
				if (t === null) t = 'modern';
				if (t === 'modern' || t === 'modern-dark') {
					document.documentElement.setAttribute('data-theme', t);
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
