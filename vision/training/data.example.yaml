# Copy to data.yaml and replace paths with an exported accepted-label dataset.
# Split entire matches/events between train/val/test; never randomly split
# neighboring frames from the same recording across sets.
path: /datasets/frc-vision-v1
train: images/train
val: images/val
test: images/test
# Train physical objects only. Climb and robot activity are temporal states
# derived from tracks/Qwen metadata, not separate object shapes. Runtime fuel
# tracking can fuse this class with the existing HSV/contour candidates.
names:
  0: robot_red
  1: robot_blue
  2: fuel
