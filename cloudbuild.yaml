substitutions:
  _REGION: us-west1
  _SERVICE_NAME: spartanshub
  _AR_REPO: spartanshub
  # PUBLIC_* build args — real, non-secret values, safe to commit: these get
  # baked into the public client bundle regardless of where they're stored.
  # Supabase's anon key is designed to be public (like a Stripe publishable
  # key) — it only grants what RLS allows the `anon` role, no bypass
  # privilege (that's SUPABASE_SERVICE_KEY, which stays in Secret Manager).
  #
  # PUBLIC_ONSHAPE_ACCESS_KEY / PUBLIC_ONSHAPE_SECRET_KEY are deliberately
  # NOT here — pulled from Secret Manager at build time instead (see
  # availableSecrets below) so the raw values never sit in this committed
  # file / git history.
  #
  # They no longer reach the client bundle. src/lib/onshape.js used to import
  # the secret without ever using it, and $env/static/public inlines whatever
  # it touches, so it shipped to every visitor of a CAD page. That import is
  # gone (GitHub issue #86); api/onshape/+server.js is now the only consumer.
  #
  # !!! REMINDER: TWO THINGS STILL OPEN ON ISSUE #86 !!!
  #
  # 1. ROTATE THE KEY. The old one was in client/_app/immutable/ for however
  #    long it shipped, so it must be considered public. This is the part that
  #    actually matters, and no code change substitutes for it.
  #
  # 2. Move it off PUBLIC_ entirely. Passing it as a PUBLIC_ build arg still
  #    puts it in $env/static/public, so a single future client-side import
  #    silently re-publishes it. api/onshape/+server.js already prefers
  #    private ONSHAPE_ACCESS_KEY / ONSHAPE_SECRET_KEY and only falls back to
  #    the PUBLIC_ pair, so the switch needs no code change:
  #      a. grant the Cloud Run runtime service account access — the build
  #         step's secretEnv uses the Cloud Build SA, which is NOT the same
  #         identity, and this exact mismatch is what broke deploys for
  #         CRON_NOTIFICATION_TOKEN (see the reminder further down):
  #           gcloud secrets add-iam-policy-binding ONSHAPE_ACCESS_KEY \
  #             --project=spartanshub \
  #             --member="serviceAccount:819718873862-compute@developer.gserviceaccount.com" \
  #             --role="roles/secretmanager.secretAccessor"
  #           (repeat for ONSHAPE_SECRET_KEY)
  #      b. add ONSHAPE_ACCESS_KEY=ONSHAPE_ACCESS_KEY:latest and
  #         ONSHAPE_SECRET_KEY=ONSHAPE_SECRET_KEY:latest to --set-secrets below
  #      c. drop the two PUBLIC_ONSHAPE_*_KEY build args from the build step
  #    Not wired here yet, because doing (b) before (a) breaks every deploy.
  _PUBLIC_SUPABASE_URL: 'https://ypkjxqwjkjkznlmjmwpe.supabase.co'
  _PUBLIC_ONSHAPE_BASE_URL: 'https://frc971.onshape.com'
  _PUBLIC_AUTO_VENDOR: 'false'
  _PUBLIC_APP_ORIGIN: 'https://spartanshub.spartanrobotics.org'
  _PUBLIC_SITE_URL: 'https://spartanshub.spartanrobotics.org'
  _PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlwa2p4cXdqa2prem5sbWptd3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk5NDk5NTYsImV4cCI6MjA2NTUyNTk1Nn0.qqKGsZ1v2UuViIfRSwU_P-RvvOJynJfHnsgAh7O9jfM'
  # Still placeholders — not yet supplied. See "Still open" in
  # docs/deployment/google-cloud-run.md.
  _PUBLIC_SENTRY_DSN: ''
  _PUBLIC_AUTOCAM_API_URL: ''
  _PUBLIC_ROUTES: ''
  _PUBLIC_TBA_API_KEY: ''
  # Non-secret runtime config for the deploy step (see --set-env-vars below).
  # Real values not supplied yet.
  _DRIVE_API: ''
  _DRIVE_UPLOAD_API: ''
  _DRIVE_SCOPE: ''
  _DRIVE_PRACTICE_CATEGORY: ''
  _SLACK_ALERT_CHANNEL_ID: ''

# Pulled into the build step below as env vars via secretEnv — never written
# to this file or git history. Requires options.logging to be non-default
# (already set at the bottom of this file) per Cloud Build's requirement
# whenever a step uses secrets.
availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/ONSHAPE_ACCESS_KEY/versions/latest'
      env: 'ONSHAPE_ACCESS_KEY'
    - versionName: 'projects/$PROJECT_ID/secrets/ONSHAPE_SECRET_KEY/versions/latest'
      env: 'ONSHAPE_SECRET_KEY'

steps:
  # Build the app image. PUBLIC_* build args are baked into the client
  # bundle at build time — see Dockerfile comment. `sh -c` (not bash — the
  # docker builder image is Alpine-based, no bash) so the two Onshape
  # secretEnv values can be referenced as real shell vars ($$ becomes a
  # literal $ after Cloud Build's own substitution pass runs first).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - >-
        docker build
        --build-arg=PUBLIC_SUPABASE_URL=${_PUBLIC_SUPABASE_URL}
        --build-arg=PUBLIC_SUPABASE_ANON_KEY=${_PUBLIC_SUPABASE_ANON_KEY}
        --build-arg=PUBLIC_SENTRY_DSN=${_PUBLIC_SENTRY_DSN}
        --build-arg=PUBLIC_ONSHAPE_ACCESS_KEY="$$ONSHAPE_ACCESS_KEY"
        --build-arg=PUBLIC_ONSHAPE_SECRET_KEY="$$ONSHAPE_SECRET_KEY"
        --build-arg=PUBLIC_ONSHAPE_BASE_URL=${_PUBLIC_ONSHAPE_BASE_URL}
        --build-arg=PUBLIC_AUTOCAM_API_URL=${_PUBLIC_AUTOCAM_API_URL}
        --build-arg=PUBLIC_APP_ORIGIN=${_PUBLIC_APP_ORIGIN}
        --build-arg=PUBLIC_SITE_URL=${_PUBLIC_SITE_URL}
        --build-arg=PUBLIC_ROUTES=${_PUBLIC_ROUTES}
        --build-arg=PUBLIC_TBA_API_KEY=${_PUBLIC_TBA_API_KEY}
        --build-arg=PUBLIC_AUTO_VENDOR=${_PUBLIC_AUTO_VENDOR}
        -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID
        -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest
        .
    secretEnv: ['ONSHAPE_ACCESS_KEY', 'ONSHAPE_SECRET_KEY']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}'

  # Deploy. Declared here (not as a one-off `gcloud run services update`) so the
  # wiring lives in version control and every deploy stays consistent.
  # --set-secrets pulls the *runtime-only* private vars from Secret Manager
  # (none of these are baked into the build — confirmed by checking that every
  # private var in src/ is read via $env/dynamic/private or process.env, never
  # $env/static/private). Create the secrets once (see
  # docs/deployment/google-cloud-run.md) before the first deploy that uses this.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - gcloud
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      # CRON_NOTIFICATION_TOKEN: resolved frc971/spartanshub issue #5 (was a live
      # security gap - src/lib/server/cron_auth.js's isAuthorizedCronRequest() is
      # fail-open when unset, so /api/planner/notifications and /api/drive-watcher
      # accepted unauthenticated requests). The secret now exists in Secret
      # Manager on spartanshub with its value matching Supabase Vault's
      # `planner_notifications_cron_token` (the real pg_cron job's own token),
      # and 536793099017-compute@developer.gserviceaccount.com has
      # roles/secretmanager.secretAccessor on it. Wired into --set-secrets below.
      #
      # Still missing: GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY (low priority - the
      # Drive watcher degrades gracefully without it and nothing schedules it
      # yet) — add to both Secret Manager and this line once a real value is
      # available (see docs/deployment/google-cloud-run.md).
      #
      # VISION_RUNNER_TOKEN: the secret now exists in Secret Manager on
      # spartanshub with the runtime service account granted
      # roles/secretmanager.secretAccessor, so it's wired into --set-secrets
      # below. What it's for: src/routes/api/vision-runner/+server.js's
      # authorized()/checkToken() is fail-CLOSED (the opposite of the cron
      # gap above) - Boolean(expected && supplied && ...) is always false
      # while this env var is unset, so that endpoint rejected every
      # request, including from a legitimate runner, until now. The SAME
      # secret value also needs to be in whatever environment runs
      # vision/runner/vision_runner.py (see vision/runner/README.md and
      # vision/runner/.env.example) - this only covers the Cloud Run side.
      - '--set-secrets=SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SLACK_BOT_TOKEN=SLACK_BOT_TOKEN:latest,SLACK_SIGNING_SECRET=SLACK_SIGNING_SECRET:latest,TBA_API_KEY=TBA_API_KEY:latest,CRON_NOTIFICATION_TOKEN=CRON_NOTIFICATION_TOKEN:latest,VISION_RUNNER_TOKEN=VISION_RUNNER_TOKEN:latest'
      # ORIGIN is adapter-node's own documented fix for a real gap: "HTTP
      # doesn't give SvelteKit a reliable way to know the URL that is
      # currently being requested" behind a reverse proxy that terminates
      # TLS (exactly Cloud Run's setup - it forwards to the container over
      # plain HTTP). Without this, `url.origin` inside a request handler can
      # resolve with the wrong scheme (http instead of https), which
      # src/routes/api/cam-generate/+server.js's getWasmBinary() actually
      # depends on to self-fetch occt-import-js's WASM binary - a wrong
      # origin there would silently break every AutoCAM generation on this
      # deployment. Reuses the same real public URL already baked into the
      # client bundle as PUBLIC_APP_ORIGIN/PUBLIC_SITE_URL above.
      - '--set-env-vars=ORIGIN=${_PUBLIC_APP_ORIGIN},SUPABASE_URL=${_PUBLIC_SUPABASE_URL},SENTRY_DSN=${_PUBLIC_SENTRY_DSN},DRIVE_API=${_DRIVE_API},DRIVE_UPLOAD_API=${_DRIVE_UPLOAD_API},DRIVE_SCOPE=${_DRIVE_SCOPE},DRIVE_PRACTICE_CATEGORY=${_DRIVE_PRACTICE_CATEGORY},SLACK_ALERT_CHANNEL_ID=${_SLACK_ALERT_CHANNEL_ID}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
